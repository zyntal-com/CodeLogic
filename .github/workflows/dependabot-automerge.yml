name: Dependabot auto-merge

# Merges a Dependabot pull request once the required checks are green.
#
# The policy splits on what a bad update can actually reach:
#
#   github-actions  - auto-merged at every level, majors included. A bad Actions bump
#                     breaks CI loudly rather than shipping anything.
#   nuget           - patch and minor only. These go INTO the build output.
#
# Every library in the ecosystem depends on this package, so its suite is the gate that
# protects all of them. Widening that suite is the most valuable safety work available here.

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Fetch update metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide
        id: decide
        run: |
          set -euo pipefail
          type='${{ steps.meta.outputs.update-type }}'
          names='${{ steps.meta.outputs.dependency-names }}'
          eco='${{ steps.meta.outputs.package-ecosystem }}'
          echo "ecosystem=$eco type=$type names=$names"

          # CI-only dependencies cannot reach a build output or a published package.
          if [ "$eco" = "github_actions" ]; then
            echo "merge=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$type" = "version-update:semver-major" ]; then
            echo "::notice::major package update - leaving for review"
            echo "reason=a major version bump of a shipped dependency" >> "$GITHUB_OUTPUT"
            echo "merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "merge=true" >> "$GITHUB_OUTPUT"

      # --auto queues the merge behind the required checks. GitHub rejects it when the PR is
      # already green ("clean status") or when auto-merge is disabled for the repository. Only
      # then fall back to a direct merge, and only if every required check has already passed:
      # this job runs seconds after the PR opens, before Tests reports, so a blind fallback
      # would merge an untested update.
      - name: Merge
        if: steps.decide.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          set -uo pipefail
          if gh pr merge --auto --squash "$PR"; then
            exit 0
          fi
          # gh pr checks exits 0 only when every required check passed (8 = pending, 1 = failed).
          if gh pr checks "$PR" --required >/dev/null 2>&1; then
            gh pr merge --squash --delete-branch "$PR"
          else
            echo "::notice::auto-merge unavailable and required checks have not all passed - leaving for review"
            gh pr comment "$PR" --body "Not auto-merged: GitHub refused to queue auto-merge and the required checks have not all passed yet. Merge it normally once they are green."
          fi

      - name: Explain why it was left alone
        if: steps.decide.outputs.merge == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.html_url }}" --body             "Not auto-merged: ${{ steps.decide.outputs.reason }}. Merge it normally once you are happy, and the pipeline takes it from there."
