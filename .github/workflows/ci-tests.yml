name: CI Tests

# The test matrix, callable from both the PR/push workflow and the release gate so the
# two cannot drift apart. Publishing to nuget.org is irreversible, so the release must
# run exactly the checks a pull request runs - not a copy of them.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # SDK version comes from global.json (11.0 line; prerelease allowed until GA).
      - name: Setup .NET 11
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build src/CodeLogic.csproj -c Release

      - name: Test
        run: dotnet test tests/CodeLogic.Tests/CodeLogic.Tests.csproj -c Release --logger "console;verbosity=normal"

      # The samples compile against the public API, so a breaking change shows up here too.
      - name: Build samples
        run: |
          dotnet build samples/CodeLogic.Demo.Console -c Release
          dotnet build samples/CodeLogic.Demo.Web -c Release
