name: Promote main

# Manual publishing. main is the working branch and never publishes by itself
# (docs/versioning.md). Run this workflow from the Actions tab to merge main into
# prerelease (preview packages) or release (stable packages); the push starts the
# release workflow for that branch. Pushing to prerelease or release by hand does the same.
#
# Publishing is irreversible - a nuget.org version can be delisted but never replaced or
# reused - so the release workflow re-runs the full suite and pre-flights every package
# before pushing any of them.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Branch to promote main into'
        type: choice
        options:
          - prerelease
          - release
        default: prerelease

permissions:
  contents: write
  actions: write

concurrency:
  group: promote-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  promote:
    # Manual runs from main only.
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge main into ${{ inputs.target }}
        id: merge
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout "$TARGET"
          git merge --no-ff origin/main -m "Merge main into $TARGET: manual promotion

          Promoted from main at ${{ github.sha }} by ${{ github.actor }}.
          The release workflow re-runs the full suite before packing."

          if git diff --quiet HEAD "origin/$TARGET"; then
            echo "::notice::$TARGET already matches main - nothing to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git push origin "$TARGET"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with GITHUB_TOKEN does not trigger other workflows - GitHub blocks
      # that to prevent recursion. The release workflow is therefore dispatched
      # explicitly rather than relying on its push trigger.
      - name: Trigger the release workflow
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref "${{ inputs.target }}"
